# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-cosmic-atomic
description: CantabOS - Personal OS based on Fedora COSMIC.

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44 

platforms:
  - linux/amd64/v2

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: script
    snippets:
      # 1. Install RPM Fusion
      - dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
      - dnf install -y https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      
      # 2. Enable Starship COPR
      - dnf copr enable -y atim/starship
      
      # 3. Install Essentials + Hardware Accel
      # We removed the non-existent mesa-vdpau-drivers-freeworld to fix the 'No match' error
      - dnf install -y --allowerasing micro starship gparted bat eza btop iperf3 pciutils usbutils p7zip p7zip-plugins distrobox ffmpeg-libs libavcodec-freeworld libva-utils mesa-va-drivers-freeworld
      
      # 4. Branding
      - sed -i 's/^NAME=.*/NAME="See Tow OS"/' /usr/lib/os-release
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="See Tow OS (COSMIC Atomic)"/' /usr/lib/os-release

  - type: default-flatpaks
    configurations:
      - scope: user

  - type: signing

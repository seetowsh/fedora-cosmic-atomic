# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-cosmic-atomic
description: My personal OS image based on official Fedora COSMIC.

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 41 

platforms:
  - linux/amd64/v2

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: shell
    commands:
      # Install RPM Fusion repos directly via dnf
      - dnf install -y https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm
      # Enable the Starship COPR
      - dnf5 copr enable -y atim/starship
      # Install the packages
      - dnf install -y micro ffmpeg-libs libavcodec-freeworld mesa-va-drivers-freeworld mesa-vdpau-drivers-freeworld libva-utils starship

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
      - scope: user

  - type: signing

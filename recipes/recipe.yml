# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: fedora-cosmic-atomic
description: My personal OS image based on official Fedora COSMIC.

# Points directly to the official Fedora source you trust
base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 42 # Matches your current request for Fedora 42

# Target architecture
platforms:
  - linux/amd64/v2 # BlueBuild current support level

modules:
  - type: files
    files:
      - source: system
        destination: /

  # Using the dnf module for modern repo management
  - type: dnf
    repos:
      # RPM Fusion for your codecs
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
      copr:
        - atim/starship
    install:
      packages:
        - micro
        - starship
        - ffmpeg-libs           # Essential for Firefox video playback
        - libavcodec-freeworld  # Standard fix for Fedora Firefox codecs
        - mesa-va-drivers-freeworld  # VA-API for AMD
        - mesa-vdpau-drivers-freeworld # Older API (optional but good for legacy)
        - libva-utils               # Tools like 'vainfo' to verify everything works
    # REMOVED: Firefox removal section. 
    # Keeping the default RPM version allows it to use the layered codecs.

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
      - scope: user

  - type: signing # Critical for your Secure Boot policy
